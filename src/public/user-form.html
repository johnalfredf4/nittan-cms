<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA CMS | User</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/user-form.js" defer></script>
</head>
<body class="bg-gradient-to-b from-white to-green-50 text-gray-800">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-green-900 text-green-100 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50 shadow-xl"
  >
    <div class="flex items-center gap-3 px-6 py-4 border-b border-green-800">
      <img src="/images/NovaLogo2-xANBbiNh.svg" class="h-8 w-8" alt="NOVA" />
      <span class="text-lg font-bold tracking-wide">NOVA CMS</span>
    </div>

    <nav class="mt-4 text-sm">
      <a href="dashboard.html" class="nav-link block px-6 py-3">Dashboard</a>
      <a href="users.html" class="block px-6 py-3 bg-green-800 text-white font-semibold">Users</a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex flex-col flex-1 md:ml-64">

    <!-- Navbar -->
    <header class="flex items-center bg-white/90 backdrop-blur border-b border-green-100 px-4 h-14 shadow-sm">
      <button class="md:hidden text-2xl text-green-800" onclick="toggleSidebar()">☰</button>

      <div class="ml-auto flex items-center gap-4">
        <span id="userLabel" class="text-sm font-semibold text-green-800"></span>
        <button id="logoutBtn"
          class="bg-red-500 hover:bg-red-600 transition text-white px-3 py-1.5 rounded-lg text-sm font-semibold">
          Logout
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="p-6 overflow-y-auto">
      <h1 class="text-xl font-semibold mb-4" id="headerTitle">Create User</h1>

      <div class="bg-white rounded shadow p-6 max-w-xl">
        <form id="userForm" class="space-y-3">

          <input name="username" placeholder="Username"
            class="w-full border rounded px-3 py-2" required />

          <input name="emailAddress" type="email" placeholder="Email Address"
            class="w-full border rounded px-3 py-2" required />

          <input id="passwordInput" name="password" type="password"
            placeholder="Password"
            class="w-full border rounded px-3 py-2" />

          <input name="firstName" placeholder="First Name"
            class="w-full border rounded px-3 py-2" required />

          <input name="middleName" placeholder="Middle Name"
            class="w-full border rounded px-3 py-2" />

          <input name="lastName" placeholder="Last Name"
            class="w-full border rounded px-3 py-2" required />

          <!-- Status (admin only, no DELETED) -->
          <select name="status" id="statusSelect"
            class="w-full border rounded px-3 py-2">
            <option value="1">ACTIVE</option>
            <option value="2">INACTIVE</option>
          </select>

          <div>
            <label class="block text-sm font-medium mb-1">Roles</label>
            <select name="roles" multiple size="6"
              class="w-full border rounded px-3 py-2"
              id="rolesList"></select>
            <p class="text-xs text-gray-500 mt-1">
              Hold Ctrl (desktop) or long-press (mobile) to select multiple.
            </p>
          </div>

          <button class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded">
            Save
          </button>
        </form>
      </div>
    </main>

  </div>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
  }

  // Auth guard
  const username = localStorage.getItem('username');
  if (!username) window.location = 'login.html';
  document.getElementById('userLabel').innerText = username;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    window.location = 'login.html';
  });
</script>

</body>
</html>
