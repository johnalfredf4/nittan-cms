<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/users.js" defer></script>
</head>
<body class="bg-gradient-to-b from-white to-green-50 text-gray-800">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-green-900 text-green-100 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50 shadow-xl"
  >
    <div class="flex items-center gap-3 px-6 py-4 border-b border-green-800">
      <img src="/images/NovaLogo2-xANBbiNh.svg" class="h-8 w-8" alt="NOVA" />
      <span class="text-lg font-bold tracking-wide">NOVA CMS</span>
    </div>

    <nav class="mt-4 text-sm" id="sidebarNav">
      <a href="dashboard.html" class="nav-link block px-6 py-3">Dashboard</a>
      <a href="users.html" class="block px-6 py-3 bg-green-800 text-white font-semibold">Users</a>
      <a href="email-templates.html" class="nav-link block px-6 py-3">Email Templates</a>
      <a href="sms-templates.html" class="nav-link block px-6 py-3">SMS Templates</a>
      <a href="product-types.html" class="nav-link block px-6 py-3">Product Types</a>
      <a href="account-retention.html" class="nav-link block px-6 py-3">Retention Settings</a>
      <a href="disposition-categories.html" class="nav-link block px-6 py-3">Disposition Categories</a>
      <a href="overrides.html" class="nav-link block px-6 py-3">Assignment Overrides</a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex flex-col flex-1 md:ml-64">

    <!-- Navbar -->
    <header class="flex items-center bg-white/90 backdrop-blur border-b border-green-100 px-4 h-14 shadow-sm">
	  <button
	    class="md:hidden text-2xl text-green-800"
	    onclick="toggleSidebar()"
	  >
	    ☰
	  </button>
	
	  <!-- Right-aligned user actions -->
	  <div class="ml-auto flex items-center gap-4">
	    <span id="userLabel" class="text-sm font-semibold text-green-800"></span>
	    <button
	      id="logoutBtn"
	      class="bg-red-500 hover:bg-red-600 transition text-white px-3 py-1.5 rounded-lg text-sm font-semibold"
	    >
	      Logout
	    </button>
	  </div>
	</header>

    <!-- Page Content -->
    <main id="pageContent" class="p-6 overflow-y-auto">
       <div class="bg-white rounded-2xl shadow overflow-hidden">
		  <!-- Header -->
		  <div class="bg-green-900 px-4 py-3 flex justify-between items-center">
		    <h2 class="text-lg font-semibold text-white">
		      User Management
		    </h2>
		
		    <a
		      id="newUserBtn"
		      href="user-form.html"
		      class="px-4 py-2 bg-green-700 hover:bg-green-800 text-white rounded-lg text-sm font-semibold transition"
		    >
		      + New User
		    </a>
		  </div>
		
		  <!-- Table -->
		  <div class="overflow-x-auto">
		    <table class="min-w-full text-sm">
		      <thead>
		        <tr class="bg-green-50 text-left text-green-900 font-semibold">
		          <th class="p-3">Username</th>
		          <th class="p-3">Name</th>
				  <th class="p-3">Email</th>
				  <th class="p-3">User Roles</th>
		          <th class="p-3">Status</th>
		          <th class="p-3 text-right">Actions</th>
		        </tr>
		      </thead>
		      <tbody id="usersTable" class="divide-y"></tbody>
		    </table>
			<!-- Pagination -->
			<div class="flex items-center justify-between px-4 py-3 bg-green-50 border-t">
			  <span id="pageInfo" class="text-sm text-green-900 font-medium"></span>
			
			  <div class="space-x-2">
			    <button
			      id="prevPageBtn"
			      class="px-3 py-1.5 bg-green-700 hover:bg-green-800 text-white rounded text-sm disabled:opacity-50"
			    >
			      Prev
			    </button>
			
			    <button
			      id="nextPageBtn"
			      class="px-3 py-1.5 bg-green-700 hover:bg-green-800 text-white rounded text-sm disabled:opacity-50"
			    >
			      Next
			    </button>
			  </div>
			</div>

		  </div>
		
		</div>

    </main>

  </div>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
  }

  // Auth guard
  const username = localStorage.getItem('username');
  if (!username) {
    window.location = 'login.html';
  }
  document.getElementById('userLabel').innerText = username;

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    window.location = 'login.html';
  });

  // Active nav highlight
  const activePage  = location.pathname.split('/').pop();
  document.querySelectorAll('.nav-link').forEach(link => {
    if (link.getAttribute('href') === activePage ) {
      link.classList.add('bg-green-800', 'text-white', 'font-semibold');
    } else {
      link.classList.add('hover:bg-green-800');
    }
  });
</script>

</body>
</html>
