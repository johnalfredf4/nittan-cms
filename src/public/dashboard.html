<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nittan CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-gray-200 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50"
  >
    <div class="flex items-center px-6 py-4 border-b border-gray-700">
      <span class="text-lg font-semibold">Nittan CMS</span>
    </div>

    <nav class="mt-4">
	  <a href="dashboard.html" class="block px-6 py-3 bg-gray-800 text-white">Dashboard</a>
      <a href="users.html" class="block px-6 py-3 hover:bg-gray-800">Users</a>
      <a href="email-templates.html" class="block px-6 py-3 hover:bg-gray-800">Email Templates</a>
      <a href="sms-templates.html" class="block px-6 py-3 hover:bg-gray-800">SMS Templates</a>
      <a href="product-types.html" class="block px-6 py-3 hover:bg-gray-800">Product Types</a>
      <a href="account-retention.html" class="block px-6 py-3 hover:bg-gray-800">Retention Settings</a>
      <a href="disposition-categories.html" class="block px-6 py-3 hover:bg-gray-800">Disposition Categories</a>
      <a href="overrides.html" class="block px-6 py-3 hover:bg-gray-800">Assignment Overrides</a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex flex-col flex-1">

    <!-- Navbar -->
    <header class="flex items-center justify-between bg-white border-b px-4 h-14">
      <button
        class="md:hidden text-2xl"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <div class="flex items-center gap-4">
        <span class="text-sm font-medium">John Fortaleza</span>
        <button class="bg-red-500 text-white px-3 py-1 rounded text-sm">
          Logout
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="p-6 overflow-y-auto">
      <h1 class="text-2xl font-semibold mb-4">Dashboard</h1>
      <div class="bg-white p-4 rounded shadow">
        Welcome to Nittan CMS.
      </div>
    </main>

  </div>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
  }
</script>

</body>
</html>
