<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NOVA CMS | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <link rel="stylesheet" href="/css/tw.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1b8f5a;
      --green-dark: #157247;
      --green-light: #e6f4ee;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --error: #dc2626;
      --bg: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
    }

    .login-card {
      width: 420px;
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 36px 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: block;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--green);
      margin: 0 0 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      background: #f3f4f6;
      font-size: 15px;
      color: var(--text-dark);
    }

    input::placeholder {
      color: #9ca3af;
    }

    .forgot {
      display: block;
      text-align: right;
      font-size: 14px;
      margin-top: 6px;
      color: var(--green);
      text-decoration: none;
      font-weight: 500;
    }

    .error {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 20px;
      color: var(--error);
      font-size: 14px;
    }

    .error-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--error);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
    }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--green);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--green-dark);
    }

    @media (max-width: 480px) {
      .login-card {
        width: 90%;
        padding: 32px 24px;
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-b from-white to-green-50">

  <!-- Login Section -->
  <main class="flex flex-1 items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl px-8 py-10">

      <!-- Logo -->
      <div class="flex justify-center mb-4">
        <img src="/images/NovaLogo2-xANBbiNh.svg" alt="NOVA Logo" class="h-20 w-20" />
      </div>

      <h1 class="text-2xl font-extrabold text-center text-green-700 mb-8">
        Login to NOVA
      </h1>

      <form id="loginForm" class="space-y-5">

        <div>
          <label class="block text-sm font-semibold text-green-700 mb-1">Username</label>
          <input
            name="username"
            placeholder="rico.br1"
            class="w-full rounded-2xl bg-gray-100 px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-green-700 mb-1">Password</label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            class="w-full rounded-2xl bg-gray-100 px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600"
            required
          />
          <div class="text-right mt-1">
            <a href="#" class="text-sm font-medium text-green-700 hover:underline">
              Forgot Password?
            </a>
          </div>
        </div>

        <!-- Error Message -->
        <div id="message" class="hidden items-center gap-2 text-sm text-red-600">
          <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-red-600 text-xs font-bold">!</span>
          <span>Invalid username or password. Please try again.</span>
        </div>

        <button
          class="w-full rounded-2xl bg-green-700 hover:bg-green-800 transition text-white py-3 font-bold tracking-wide"
        >
          Log In
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-400 pb-4">
    © 2026 Nittan CMS
  </footer>

  <!-- Login Script (UNCHANGED LOGIC) -->
  <script>
    document.querySelector("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = new FormData(e.target);
      const body = new URLSearchParams(form);

      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });

      const messageEl = document.getElementById("message");

      if (!res.ok) {
        messageEl.classList.remove("hidden");
        return;
      }

      const data = await res.json();

      localStorage.setItem("token", data.token);
      localStorage.setItem("roles", JSON.stringify(data.user.roles));
      localStorage.setItem("username", data.user.username);

      window.location = "dashboard.html";
    });
  </script>

</body>
</html>
