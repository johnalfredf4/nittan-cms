<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nittan CMS | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <link rel="stylesheet" href="css/tw.css">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Login Section -->
  <main class="flex flex-1 items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">
      <div class="flex justify-center mb-4">
        <img src="/images/NovaLogo2-xANBbiNh.svg" alt="NOVA Logo" class="h-20 w-20" />
      </div>
      <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">
        Login to NOVA CMS 
      </h1>

      <form id="loginForm" class="space-y-4">
        <input
          name="username"
          placeholder="Username"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

        <button
          class="w-full bg-blue-600 hover:bg-blue-700 transition text-white py-2 rounded font-medium"
        >
          Login
        </button>
      </form>

      <p
        id="message"
        class="mt-4 text-center text-sm text-red-600"
      ></p>

    </div>
  </main>

  <!-- Footer (optional but nice) -->
  <footer class="text-center text-xs text-gray-400 pb-4">
    © 2026 Nittan CMS
  </footer>

  <!-- Login Script (UNCHANGED LOGIC) -->
  <script>
    document.querySelector("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = new FormData(e.target);
      const body = new URLSearchParams(form);

      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });

      if (!res.ok) {
        document.getElementById("message").innerText =
          "Invalid username or password";
        return;
      }

      const data = await res.json();

      localStorage.setItem("token", data.token);
      localStorage.setItem("roles", JSON.stringify(data.user.roles));
      localStorage.setItem("username", data.user.username);

      window.location = "dashboard.html";
    });
  </script>

</body>
</html>
