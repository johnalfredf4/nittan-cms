<html lang="en">

</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Top Navbar -->
  <header class="h-14 bg-gray-900 text-white flex items-center justify-center shadow">
    <span class="text-lg font-semibold tracking-wide">NOVA-NITTAN CMS</span>
  </header>

  <!-- Login Section -->
  <main class="flex flex-1 items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">

      <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">
        Sign in
      </h1>

      <form id="loginForm" class="space-y-4">
        <input
          name="username"
          placeholder="Username"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

        <button
          class="w-full bg-blue-600 hover:bg-blue-700 transition text-white py-2 rounded font-medium"
        >
          Login
        </button>
      </form>

      <p
        id="message"
        class="mt-4 text-center text-sm text-red-600"
      ></p>

    </div>
  </main>

  <!-- Footer (optional but nice) -->
  <footer class="text-center text-xs text-gray-400 pb-4">
    © 2026 Nittan CMS
  </footer>

  <!-- Login Script (UNCHANGED LOGIC) -->
  <script>
    document.querySelector("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = new FormData(e.target);
      const body = new URLSearchParams(form);

      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });

      if (!res.ok) {
        document.getElementById("message").innerText =
          "Invalid username or password";
        return;
      }

      const data = await res.json();

      localStorage.setItem("token", data.token);
      localStorage.setItem("roles", JSON.stringify(data.user.roles));
      localStorage.setItem("username", data.user.username);

      window.location = "dashboard.html";
    });
  </script>

</body>
</html>

  <script>
  document.querySelector("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const body = new URLSearchParams(form);

    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body
    });

    if (!res.ok) {
      document.getElementById("message").innerText = "Invalid username or password";
      return;
    }

    const data = await res.json();
    localStorage.setItem("token", data.token);
    localStorage.setItem("roles", JSON.stringify(data.user.roles));
    localStorage.setItem("username", data.user.username);

    window.location = "dashboard.html";
  });
  </script>
