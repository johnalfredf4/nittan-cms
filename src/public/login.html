<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NOVA CMS | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <link rel="stylesheet" href="css/tw.css">
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-b from-white to-green-50">

  <!-- Login Section -->
  <main class="flex flex-1 items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl px-8 py-10">

      <!-- Logo -->
      <div class="flex justify-center mb-4">
        <img src="NovaLogo2-xANBbiNh.svg" alt="NOVA Logo" class="h-20 w-20" />
      </div>

      <h1 class="text-2xl font-extrabold text-center text-green-700 mb-8">
        Login to NOVA
      </h1>

      <form id="loginForm" class="space-y-5">

        <div>
          <label class="block text-sm font-semibold text-green-700 mb-1">Username</label>
          <input
            name="username"
            placeholder="rico.br1"
            class="w-full rounded-2xl bg-gray-100 px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-green-700 mb-1">Password</label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            class="w-full rounded-2xl bg-gray-100 px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600"
            required
          />
          <div class="text-right mt-1">
            <a href="#" class="text-sm font-medium text-green-700 hover:underline">
              Forgot Password?
            </a>
          </div>
        </div>

        <!-- Error Message -->
        <div id="message" class="hidden items-center gap-2 text-sm text-red-600">
          <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-red-600 text-xs font-bold">!</span>
          <span>Invalid username or password. Please try again.</span>
        </div>

        <button
          class="w-full rounded-2xl bg-green-700 hover:bg-green-800 transition text-white py-3 font-bold tracking-wide"
        >
          Log In
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-400 pb-4">
    © 2026 Nittan CMS
  </footer>

  <!-- Login Script (UNCHANGED LOGIC) -->
  <script>
    document.querySelector("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = new FormData(e.target);
      const body = new URLSearchParams(form);

      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });

      const messageEl = document.getElementById("message");

      if (!res.ok) {
        messageEl.classList.remove("hidden");
        return;
      }

      const data = await res.json();

      localStorage.setItem("token", data.token);
      localStorage.setItem("roles", JSON.stringify(data.user.roles));
      localStorage.setItem("username", data.user.username);

      window.location = "dashboard.html";
    });
  </script>

</body>
</html>
