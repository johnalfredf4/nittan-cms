<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/email-template-form.js?v=2" defer></script>
    <style>
    .toolbar-btn {
      border: 1px solid #ccc;
      padding: 4px 7px;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      transition: 0.15s;
    }
    .toolbar-btn:hover {
      background: #e5f1ff;
    }
    </style>
</head>
<body class="bg-gradient-to-b from-white to-green-50 text-gray-800">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-green-900 text-green-100 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50 shadow-xl"
  >
    <div class="flex items-center gap-3 px-6 py-4 border-b border-green-800">
      <img src="/images/NovaLogo2-xANBbiNh.svg" class="h-8 w-8" alt="NOVA" />
      <span class="text-lg font-bold tracking-wide">NOVA CMS</span>
    </div>

    <nav class="mt-4 text-sm" id="sidebarNav">
      <a href="dashboard.html" class="nav-link block px-6 py-3">Dashboard</a>
      <a href="users.html" class="nav-link block px-6 py-3">Users</a>
      <a href="email-templates.html" class="block px-6 py-3 bg-green-800 text-white font-semibold">Email Templates</a>
      <a href="sms-templates.html" class="nav-link block px-6 py-3">SMS Templates</a>
      <a href="product-types.html" class="nav-link block px-6 py-3">Product Types</a>
      <a href="account-retention.html" class="nav-link block px-6 py-3">Retention Settings</a>
      <a href="disposition-categories.html" class="nav-link block px-6 py-3">Disposition Categories</a>
      <a href="overrides.html" class="nav-link block px-6 py-3">Assignment Overrides</a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex flex-col flex-1 md:ml-64">

    <!-- Navbar -->
    <header class="flex items-center bg-white/90 backdrop-blur border-b border-green-100 px-4 h-14 shadow-sm">
	  <button
	    class="md:hidden text-2xl text-green-800"
	    onclick="toggleSidebar()"
	  >
	    ☰
	  </button>
	
	  <!-- Right-aligned user actions -->
	  <div class="ml-auto flex items-center gap-4">
	    <span id="userLabel" class="text-sm font-semibold text-green-800"></span>
	    <button
	      id="logoutBtn"
	      class="bg-red-500 hover:bg-red-600 transition text-white px-3 py-1.5 rounded-lg text-sm font-semibold"
	    >
	      Logout
	    </button>
	  </div>
	</header>

    <!-- Main -->

    <!-- Page Content -->
    <main class="p-6 overflow-y-auto">
      <div class="flex items-center gap-3 mb-4">
		  <a
			href="email-templates.html"
			class="inline-flex items-center gap-1 text-sm text-green-700 hover:text-green-900 font-medium"
		  >
			← Back
		  </a>
		
		  <h1 class="text-xl font-semibold" id="headerTitle">
			Create User
		  </h1>
		</div>
		<div class="bg-white rounded shadow p-6">
        <form id="templateForm" class="space-y-4">

            <input id="code" name="code" placeholder="Template Code" required class="w-full border rounded px-3 py-2">
            
            <input name="name" placeholder="Template Name" class="w-full border px-3 py-2 rounded" required>

            <input name="subject" placeholder="Email Subject" class="w-full border px-3 py-2 rounded" required>

            <label class="block text-sm font-medium mb-1">Email Body</label>

            <!-- ⭐️ UPGRADED TOOLBAR -->
            <div class="flex flex-wrap gap-1 mb-2 text-sm">
            
              <button type="button" onclick="execCmd('bold')" class="toolbar-btn font-bold">B</button>
              <button type="button" onclick="execCmd('italic')" class="toolbar-btn italic">I</button>
              <button type="button" onclick="execCmd('underline')" class="toolbar-btn underline">U</button>
            
              <button type="button" onclick="execCmd('insertUnorderedList')" class="toolbar-btn">• List</button>
              <button type="button" onclick="execCmd('insertOrderedList')" class="toolbar-btn">1. List</button>
            
              <button type="button" onclick="execCmd('undo')" class="toolbar-btn">⟲ Undo</button>
              <button type="button" onclick="execCmd('redo')" class="toolbar-btn">⟳ Redo</button>
            
              <button type="button" onclick="addLink()" class="toolbar-btn text-blue-600">🔗 Link</button>
              <button type="button" onclick="removeLink()" class="toolbar-btn text-red-600">❌ Link</button>
            
              <button type="button" onclick="setColor()" class="toolbar-btn">🎨 Text Color</button>
              <button type="button" onclick="setHighlight()" class="toolbar-btn bg-yellow-200">🖍 Highlight</button>
            
              <select onchange="setFontSize(this.value)" class="border px-1 rounded">
                <option value="">Size</option>
                <option value="2">Small</option>
                <option value="3">Normal</option>
                <option value="4">Medium</option>
                <option value="5">Large</option>
                <option value="6">XL</option>
              </select>
            
              <button type="button" onclick="execCmd('justifyLeft')" class="toolbar-btn">⬅</button>
              <button type="button" onclick="execCmd('justifyCenter')" class="toolbar-btn">⬍</button>
              <button type="button" onclick="execCmd('justifyRight')" class="toolbar-btn">➡</button>
            
            </div>
            
            <!-- Editable HTML Area -->
            <div id="bodyInput"
             class="w-full border rounded px-4 py-3 bg-white resize-y overflow-auto shadow-sm focus:outline-blue-400"
             style="min-height: 500px"
             contenteditable="true"></div>

            
            <input type="hidden" name="body" id="bodyHidden">

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded">
                Save
            </button>
        </form>
    </div>

      
    </main>

  </div>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
  }

  // Auth guard
  const username = localStorage.getItem('username');
  if (!username) window.location = 'login.html';
  document.getElementById('userLabel').innerText = username;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    window.location = 'login.html';
  });
</script>

</body>
</html>
