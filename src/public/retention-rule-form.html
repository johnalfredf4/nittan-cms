<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/retention-rule-form.js" defer></script>
</head>

<body class="bg-gradient-to-b from-white to-green-50 text-gray-800">

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-green-900 text-green-100 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50 shadow-xl"
  >
    <div class="flex items-center gap-3 px-6 py-4 border-b border-green-800">
      <img src="/images/NovaLogo2-xANBbiNh.svg" class="h-8 w-8" alt="NOVA" />
      <span class="text-lg font-bold tracking-wide">NOVA CMS</span>
    </div>

    <nav class="mt-4 text-sm" id="sidebarNav">
      <a href="dashboard.html" class="nav-link block px-6 py-3">Dashboard</a>
      <a href="users.html" class="nav-link block px-6 py-3">Users</a>
      <a href="email-templates.html" class="nav-link block px-6 py-3">Email Templates</a>
      <a href="sms-templates.html" class="nav-link block px-6 py-3">SMS Templates</a>
      <a href="product-types.html" class="nav-link block px-6 py-3">Product Types</a>
      <a href="retention-rules.html" class="block px-6 py-3 bg-green-800 text-white font-semibold">Retention Settings</a>
      <a href="disposition-categories.html" class="nav-link block px-6 py-3">Disposition Categories</a>
      <a href="overrides.html" class="nav-link block px-6 py-3">Assignment Overrides</a>
    </nav>
  </aside>

  <div class="flex flex-col flex-1 md:ml-64">

    <!-- Navbar -->
    <header class="flex items-center bg-white/90 backdrop-blur border-b border-green-100 px-4 h-14 shadow-sm">
	  <button
	    class="md:hidden text-2xl text-green-800"
	    onclick="toggleSidebar()"
	  >
	    ☰
	  </button>
	
	  <!-- Right-aligned user actions -->
	  <div class="ml-auto flex items-center gap-4">
	    <span id="userLabel" class="text-sm font-semibold text-green-800"></span>
	    <button
	      id="logoutBtn"
	      class="bg-red-500 hover:bg-red-600 transition text-white px-3 py-1.5 rounded-lg text-sm font-semibold"
	    >
	      Logout
	    </button>
	  </div>
	</header>

    <main class="p-6 overflow-y-auto">
      <div class="flex items-center gap-3 mb-4">
        <a href="retention-rules.html"
           class="text-sm text-green-700 hover:text-green-900">
          ← Back
        </a>
        <h1 id="formTitle" class="text-xl font-semibold">Retention Rule</h1>
      </div>

      <div class="bg-white rounded shadow p-6 max-w-xl">
        <form id="ruleForm" class="space-y-4">
          <input type="hidden" id="id" />

          <div>
            <label class="text-sm">Category Code</label>
            <input id="categoryCode" class="border p-2 rounded w-full" required />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-sm">DPD Min</label>
              <input type="number" id="dpdMin" class="border p-2 rounded w-full" required />
            </div>
            <div>
              <label class="text-sm">DPD Max</label>
              <input type="number" id="dpdMax" class="border p-2 rounded w-full" required />
            </div>
          </div>

          <div>
            <label class="text-sm">Retention Days</label>
            <input type="number" id="retentionDays" min="1" class="border p-2 rounded w-full" required />
          </div>

          <div>
            <label class="text-sm">Label</label>
            <input id="label" class="border p-2 rounded w-full" />
          </div>

          <div class="flex items-center gap-2">
            <input type="checkbox" id="isActive" checked />
            <label class="text-sm">Active</label>
          </div>

          <div class="flex gap-2 pt-4">
            <button type="button"
                    onclick="location.href='retention-rules.html'"
                    class="px-4 py-1 border rounded">
              Cancel
            </button>
            <button type="submit"
                    class="px-4 py-1 bg-green-600 text-white rounded">
              Save
            </button>
          </div>
        </form>
      </div>

    </main>

  </div>
</div>

</body>
</html>
